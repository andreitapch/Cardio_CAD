# Cardio_CAD conda environment.
#
#   conda env create -f environment.yml
#   conda activate cardioCad
#
# To update an existing env after this file changes:
#   conda env update -f environment.yml --prune
#
# To capture exactly what you ended up with (do this once it works, and commit
# it alongside this file - it is the reproducible record, this file is the
# human-readable intent):
#   conda env export --no-builds > environment.lock.yml
#
# Package set derived from an import scan of the 157 Python files in this repo,
# not from the historical install notes. Version floors are the versions whose
# APIs the code actually relies on; see the comments against each one.

name: cardioCad

channels:
  - conda-forge

dependencies:
  # conda-forge alone resolves everything below; mixing in defaults is what
  # made the old environment slow and occasionally unsolvable.
  - python=3.11

  # --- core numerics -------------------------------------------------------
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10

  # --- machine learning ----------------------------------------------------
  # scikit-learn 1.3+: StratifiedGroupKFold, and set_output on transformers.
  - scikit-learn>=1.3
  # imbalanced-learn 0.11+: Pipeline that applies samplers on fit only.
  - imbalanced-learn>=0.11
  # xgboost 2.0 removed use_label_encoder, which this code no longer passes.
  - xgboost>=2.0
  - lightgbm>=4.0
  # shap 0.44+: the Explanation object with .values / .data / .feature_names.
  - shap>=0.44
  - lime>=0.2

  # --- dashboard -----------------------------------------------------------
  - streamlit>=1.40
  - plotly>=5.18
  # static image export for plotly (fig.write_image)
  - python-kaleido>=0.2

  # --- plotting ------------------------------------------------------------
  - matplotlib>=3.7
  - seaborn>=0.13

  # --- database ------------------------------------------------------------
  # Needs the "ODBC Driver 17 for SQL Server" system driver as well; pyodbc is
  # only the Python binding. See dbConParameters in
  # pattern_recognition/utils/parameters_dics.py.
  - pyodbc>=5.0
  - sqlalchemy>=2.0

  # --- medical imaging / IO ------------------------------------------------
  - pydicom>=2.4
  - scikit-image>=0.22
  - h5py>=3.10
  - openpyxl>=3.1        # pandas .xlsx read/write
  - opencv>=4.8          # imported as cv2, in utils/avi_mat.py

  # --- deep learning -------------------------------------------------------
  # CPU build. For CUDA, drop these two lines and follow the selector at
  # https://pytorch.org/get-started/locally/ after creating the env.
  # Used by cardio_app/services/autoencoder.py, which is on the live viewer
  # path, so this is not optional -- and by the frozen
  # EchoCLIP trunk in motion_estimator/echoclip/, which wants a CUDA build.
  # open_clip itself comes via requirements-pip.txt.
  - pytorch>=2.1
  - torchvision>=0.16

  # --- utilities -----------------------------------------------------------
  - tqdm>=4.66
  - natsort>=8.4
  - chardet>=5.2
  - loguru>=0.7
  - pydantic>=2.5        # utils/SmoothAHAplot validators use the v2 API
  - kneed>=0.8
  - pingouin>=0.5
  - sympy>=1.12

  # --- tests ---------------------------------------------------------------
  - pytest>=7.4

  - pip>=23.3
  - pip:
      # Not packaged on conda-forge, or only reliably current on PyPI.
      - -r requirements-pip.txt
